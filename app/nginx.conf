server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 传输优化：gzip 压缩常见文本资源
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # SEO 静态文件：短期缓存，避免更新后爬虫拿到旧内容
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }

    # 入口 HTML：不缓存（HTML5 History 下所有 SPA 路径都由它兜底）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 指纹静态资源（assets/ 下带内容哈希）：长缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 回退：优先命中预渲染产物（/character-builder/ 等目录），再回退入口 HTML
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 预渲染 404 页（vite-ssg 输出 dist/404/index.html）；未被 try_files 兜底的真实缺失路径返回它
    error_page 404 /404/;
}
